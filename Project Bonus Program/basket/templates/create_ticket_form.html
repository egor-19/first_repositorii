<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформить билет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Оформить билет</h2>
    <form method="post">
        <div class="mb-3">
            <label for="flight_number" class="form-label">Номер рейса</label>
            <input type="text" class="form-control" id="flight_number" name="flight_number" required>
        </div>
        <div class="mb-3">
            <label for="passenger_name" class="form-label">Имя пассажира</label>
            <input type="text" class="form-control" id="passenger_name" name="passenger_name" required>
        </div>
        <div class="mb-3">
            <label for="passport" class="form-label">Паспорт</label>
            <input type="text" class="form-control" id="passport" name="passport" required>
        </div>
        <div class="mb-3">
            <label for="seat" class="form-label">Место</label>
            <input type="text" class="form-control" id="seat" name="seat" required>
        </div>
        <div class="mb-3">
            <label for="ticket_class" class="form-label">Класс</label>
            <select class="form-select" id="ticket_class" name="ticket_class" required>
                <option value="эконом">Эконом</option>
                <option value="бизнес">Бизнес</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Цена</label>
            <input type="number" class="form-control" id="price" name="price" required>
        </div>
        <button type="submit" class="btn btn-success">Оформить билет</button>
        <a href="/order" class="btn btn-secondary ms-2">Назад в корзину</a>
    </form>
    {% if message %}
        <div class="alert alert-info mt-3">{{ message }}</div>
    {% endif %}
</div>
</body>
</html>
