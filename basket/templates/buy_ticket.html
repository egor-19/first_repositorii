<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Покупка билета</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Купить билет</h2>
    <form method="post">
        <div class="mb-3">
            <label for="flight_id" class="form-label">Выберите рейс</label>
            <select class="form-select" id="flight_id" name="flight_id" required>
                {% for flight in flights %}
                <option value="{{ flight.flight_id }}">
                    {{ flight.flight_number }}: {{ flight.departure_airport }} → {{ flight.arrival_airport }} ({{ flight.departure_date }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="first_name" class="form-label">Имя пассажира</label>
            <input type="text" class="form-control" id="first_name" name="first_name" required>
        </div>
        <div class="mb-3">
            <label for="last_name" class="form-label">Фамилия пассажира</label>
            <input type="text" class="form-control" id="last_name" name="last_name" required>
        </div>
        <div class="mb-3">
            <label for="ticket_class" class="form-label">Класс</label>
            <select class="form-select" id="ticket_class" name="ticket_class" required>
                <option value="эконом">Эконом</option>
                <option value="бизнес">Бизнес</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Купить билет</button>
        <a href="{{ url_for('basket_bp.order_index') }}" class="btn btn-secondary ms-2">Назад в корзину</a>
    </form>
    {% if message %}
        <div class="alert alert-info mt-3">{{ message }}</div>
    {% endif %}
</div>
</body>
</html>
