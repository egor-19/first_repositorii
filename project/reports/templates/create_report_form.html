<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание отчета - {{ report_config.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
</head>
<body>
    <div class="container">
        <h1>Создание отчета</h1>
        <h3>{{ report_config.name }}</h3>

        <div class="form-container">
            <form method="POST">
                {% for field in report_config.form_fields %}
                <div class="form-group">
                    <label for="{{ field.name }}">{{ field.label }}:</label>
                          <input type="{{ field.type }}"
                              id="{{ field.name }}"
                              name="{{ field.name }}"
                              placeholder="{{ field.placeholder }}">
                </div>
                {% endfor %}

                <button type="submit">Создать отчет</button>
            </form>

            <a href="{{ url_for('reports_bp.reports_menu') }}" class="button button-secondary">
                Назад к меню отчетов
            </a>
        </div>
    </div>
</body>
</html>
