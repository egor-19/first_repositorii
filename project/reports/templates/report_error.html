<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка отчета</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
</head>
<body>
    <div class="container">
        <h1>Ошибка</h1>

        <div class="error-message">
            {{ message }}
        </div>

        <div class="button-group">
            {% if return_url %}
                <a href="{{ return_url }}" class="button">Вернуться назад</a>
            {% endif %}
            <a href="{{ url_for('reports_bp.reports_menu') }}" class="button button-secondary">Меню отчетов</a>
            <a href="{{ url_for('main_menu') }}" class="button exit">Главное меню</a>
        </div>
    </div>
</body>
</html>
